[visual]
show_header = true                   # Show the PHOENIX logo as an ANSI-code-colored banner

[output]
dir         = "output"               # The output directory

[grmhd]
dump_file   = "input/data2000.dat"   # The GRMHD data dump
grid_file   = "input/grid_mks.in"    # The BHAC grid settings
gpu_decode  = false                  # Decode the primitives on the GPU
nspin       = 3                      # Index of the spin in the dump's neqpar
sfc         = false                  # Read the data as a Morton space filling curve
nlevels     = -1                     # The max number of AMR refinement levels (-1 if unknown)